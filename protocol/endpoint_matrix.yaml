schema_version: 1
updated: "2026-08-22"
canonical_client_boundary: "Chapter 9 clear (physical-device playthrough); Chapter 2-1 trace-backed"
statuses:
  confirmed: "wire shape and surviving-client acceptance are confirmed"
  static_confirmed: "client-static contract is confirmed; live acceptance is incomplete"
  local_policy: "implemented preservation behavior, not a historical-service claim"
  unsupported: "fails explicitly rather than returning generic success"
capabilities:
